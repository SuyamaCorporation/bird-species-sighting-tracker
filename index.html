<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bird Species Field Observation Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-950 text-white min-h-screen">
<script>
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>

<div class="max-w-3xl mx-auto p-4">
  <div class="flex items-center gap-3 mb-6">
    <span class="text-4xl">🦜</span>
    <div>
      <h1 class="text-2xl font-bold text-emerald-400">Bird Sighting Tracker</h1>
      <p class="text-gray-400 text-sm">Log observations · Build your life list</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex gap-2 mb-4 border-b border-green-800 pb-2">
    <button onclick="showTab('log')" id="tab-log" class="tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-emerald-700 text-white">Add Sighting</button>
    <button onclick="showTab('list')" id="tab-list" class="tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-green-900 text-gray-300 hover:bg-green-800">Life List</button>
    <button onclick="showTab('history')" id="tab-history" class="tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-green-900 text-gray-300 hover:bg-green-800">Log</button>
    <button onclick="showTab('stats')" id="tab-stats" class="tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-green-900 text-gray-300 hover:bg-green-800">Stats</button>
  </div>

  <!-- Add Sighting -->
  <div id="panel-log">
    <div class="bg-green-900/50 rounded-xl p-4 border border-green-800">
      <h2 class="font-semibold text-emerald-300 mb-3">New Sighting</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-gray-400 block mb-1">Species Name *</label>
          <input id="f-species" type="text" placeholder="e.g. American Robin" maxlength="80"
            class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Location *</label>
          <input id="f-location" type="text" placeholder="e.g. Central Park, NY" maxlength="80"
            class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Date *</label>
          <input id="f-date" type="date"
            class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Count</label>
          <input id="f-count" type="number" value="1" min="1" max="9999"
            class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Weather</label>
          <select id="f-weather" class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">—</option>
            <option>☀️ Sunny</option><option>⛅ Partly Cloudy</option>
            <option>🌧 Rainy</option><option>🌫 Foggy</option><option>❄️ Snowy</option><option>💨 Windy</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Behavior Notes</label>
          <input id="f-notes" type="text" placeholder="Foraging, singing, nesting…" maxlength="120"
            class="w-full bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>
      <button onclick="addSighting()" class="mt-4 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-bold transition">
        + Log Sighting
      </button>
      <div id="addMsg" class="mt-2 text-sm hidden"></div>
    </div>
  </div>

  <!-- Life List -->
  <div id="panel-list" class="hidden">
    <div class="flex gap-3 mb-3">
      <input id="searchInput" type="text" placeholder="Search species or location…" maxlength="60"
        oninput="renderLifeList()"
        class="flex-1 bg-green-900 border border-green-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
    </div>
    <div id="lifeList"></div>
  </div>

  <!-- Log -->
  <div id="panel-history" class="hidden">
    <div id="sightingLog"></div>
  </div>

  <!-- Stats -->
  <div id="panel-stats" class="hidden">
    <div id="statsPanel"></div>
  </div>
</div>

<script>
let sightings = JSON.parse(localStorage.getItem('bird_sightings') || '[]');

// Default today's date
document.getElementById('f-date').value = new Date().toISOString().split('T')[0];

function save() { localStorage.setItem('bird_sightings', JSON.stringify(sightings)); }

function addSighting() {
  const sp = document.getElementById('f-species').value.trim();
  const loc = document.getElementById('f-location').value.trim();
  const date = document.getElementById('f-date').value;
  const count = parseInt(document.getElementById('f-count').value) || 1;
  const weather = document.getElementById('f-weather').value;
  const notes = document.getElementById('f-notes').value.trim();
  const msg = document.getElementById('addMsg');

  if (!sp || !loc || !date) {
    msg.className = 'mt-2 text-sm text-red-400';
    msg.textContent = 'Please fill in Species, Location, and Date.';
    msg.classList.remove('hidden');
    return;
  }
  sightings.unshift({ id: Date.now(), species: sp, location: loc, date, count, weather, notes });
  save();
  msg.className = 'mt-2 text-sm text-emerald-400';
  msg.textContent = `✓ Logged: ${sp} (×${count}) at ${loc}`;
  msg.classList.remove('hidden');
  document.getElementById('f-species').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-count').value = '1';
  document.getElementById('f-notes').value = '';
  document.getElementById('f-weather').value = '';
  setTimeout(() => msg.classList.add('hidden'), 3000);
}

function showTab(name) {
  ['log','list','history','stats'].forEach(t => {
    document.getElementById('panel-' + t).classList.toggle('hidden', t !== name);
    const btn = document.getElementById('tab-' + t);
    if (btn) { btn.className = t === name
      ? 'tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-emerald-700 text-white'
      : 'tab-btn px-4 py-2 rounded-t-lg text-sm font-medium bg-green-900 text-gray-300 hover:bg-green-800'; }
  });
  if (name === 'list') renderLifeList();
  if (name === 'history') renderLog();
  if (name === 'stats') renderStats();
}

function renderLifeList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const map = {};
  sightings.forEach(s => {
    if (q && !s.species.toLowerCase().includes(q) && !s.location.toLowerCase().includes(q)) return;
    if (!map[s.species]) map[s.species] = { firstDate: s.date, count: 0 };
    if (s.date < map[s.species].firstDate) map[s.species].firstDate = s.date;
    map[s.species].count += s.count;
  });
  const list = Object.entries(map).sort((a,b) => a[0].localeCompare(b[0]));
  const container = document.getElementById('lifeList');
  if (!list.length) { container.innerHTML = '<p class="text-gray-500 text-center py-8">No species found.</p>'; return; }
  container.innerHTML = `<p class="text-xs text-gray-400 mb-2">${list.length} species in life list</p>` +
    list.map(([sp, info]) => `
      <div class="bg-green-900/50 border border-green-800 rounded-xl px-4 py-3 mb-2 flex items-center justify-between">
        <div>
          <div class="font-medium text-white">🐦 ${escapeHtml(sp)}</div>
          <div class="text-xs text-gray-400">First seen: ${escapeHtml(info.firstDate)}</div>
        </div>
        <div class="text-emerald-400 font-bold text-lg">${info.count}<span class="text-xs text-gray-400 ml-1">ind.</span></div>
      </div>
    `).join('');
}

function renderLog() {
  const container = document.getElementById('sightingLog');
  if (!sightings.length) { container.innerHTML = '<p class="text-gray-500 text-center py-8">No sightings logged yet.</p>'; return; }
  container.innerHTML = sightings.map(s => `
    <div class="bg-green-900/50 border border-green-800 rounded-xl px-4 py-3 mb-2">
      <div class="flex items-start justify-between gap-3">
        <div class="flex-1">
          <div class="font-semibold text-white">🐦 ${escapeHtml(s.species)}</div>
          <div class="text-sm text-gray-400">📍 ${escapeHtml(s.location)} · 📅 ${escapeHtml(s.date)} · ×${s.count}</div>
          ${s.weather ? `<div class="text-xs text-gray-500">${escapeHtml(s.weather)}</div>` : ''}
          ${s.notes ? `<div class="text-xs text-emerald-300 italic mt-1">${escapeHtml(s.notes)}</div>` : ''}
        </div>
        <button onclick="deleteSighting(${s.id})" class="text-gray-600 hover:text-red-400 text-xl transition">×</button>
      </div>
    </div>
  `).join('');
}

function deleteSighting(id) {
  sightings = sightings.filter(s => s.id !== id);
  save();
  renderLog();
}

function renderStats() {
  const container = document.getElementById('statsPanel');
  if (!sightings.length) { container.innerHTML = '<p class="text-gray-500 text-center py-8">No data yet.</p>'; return; }

  const speciesSet = new Set(sightings.map(s => s.species));
  const totalIndividuals = sightings.reduce((a,s) => a + s.count, 0);

  const speciesCount = {};
  sightings.forEach(s => { speciesCount[s.species] = (speciesCount[s.species] || 0) + s.count; });
  const topSpecies = Object.entries(speciesCount).sort((a,b) => b[1]-a[1])[0];

  const monthCount = Array(12).fill(0);
  sightings.forEach(s => { const m = parseInt(s.date.split('-')[1]) - 1; if (m >= 0) monthCount[m] += s.count; });
  const topMonth = monthCount.indexOf(Math.max(...monthCount));
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const maxM = Math.max(...monthCount, 1);

  container.innerHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
      ${[
        ['🦜 Species', speciesSet.size],
        ['🔢 Individuals', totalIndividuals],
        ['📋 Records', sightings.length],
        ['🏆 Most Seen', topSpecies ? topSpecies[0].split(' ')[0] : '—']
      ].map(([label, val]) => `
        <div class="bg-green-900/50 border border-green-800 rounded-xl p-3 text-center">
          <div class="text-xs text-gray-400">${label}</div>
          <div class="text-xl font-bold text-emerald-400">${escapeHtml(String(val))}</div>
        </div>
      `).join('')}
    </div>
    <div class="bg-green-900/50 border border-green-800 rounded-xl p-4">
      <h3 class="text-sm font-semibold text-emerald-300 mb-3">Monthly Activity Heatmap</h3>
      <div class="flex gap-1 items-end h-16">
        ${monthCount.map((c, i) => {
          const h = Math.max(4, Math.round((c / maxM) * 56));
          const active = i === topMonth ? 'bg-emerald-400' : 'bg-emerald-700';
          return `<div class="flex-1 flex flex-col items-center gap-1">
            <div class="${active} rounded-t" style="height:${h}px" title="${months[i]}: ${c}"></div>
            <span class="text-xs text-gray-500">${months[i][0]}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// Seed sample data if empty
if (!sightings.length) {
  const samples = [
    {id:1,species:'American Robin',location:'Central Park',date:'2026-03-15',count:3,weather:'☀️ Sunny',notes:'Foraging in grass'},
    {id:2,species:'Blue Jay',location:'Backyard',date:'2026-04-02',count:2,weather:'⛅ Partly Cloudy',notes:'Calling loudly'},
    {id:3,species:'Bald Eagle',location:'Lake Shore',date:'2026-05-20',count:1,weather:'☀️ Sunny',notes:'Soaring overhead'},
    {id:4,species:'American Robin',location:'Riverside Park',date:'2026-05-10',count:5,weather:'🌧 Rainy',notes:''},
  ];
  sightings = samples;
  save();
}
</script>
</body>
</html>
